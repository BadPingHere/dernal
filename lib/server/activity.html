<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!---Hey if youre reading my web source code. please dont.-->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dernal</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #070707;
      --panel: #181b21;
      --border: #2b3039;
      --text: #d8dce5;
      --muted: #929baa;
      --accent: #73bf69;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--background);
      color: var(--text);
      font: 15px "Segoe UI", sans-serif;
    }

    main {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      padding: 12px 18px 0;
    }

    .chart-heading {
      position: relative;
      flex-shrink: 0;
      min-height: 44px;
      padding: 4px 112px 12px;
    }

    #graph-title {
      margin: 0;
      text-align: center;
      font-size: 18px;
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .chart-controls {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      gap: 4px;
    }

    #chart-theme {
      position: absolute;
      top: 0;
      left: 0;
      max-width: 104px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    #chart-theme:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .chart-controls button {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      padding: 6px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .chart-controls button:hover {
      background: var(--panel);
      color: var(--text);
    }

    .chart-controls button[aria-pressed="true"] {
      color: var(--accent);
    }

    .chart-controls button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .chart-controls button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .chart-controls svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #chart {
      flex: 1;
      min-height: 0;
      width: 100%;
      touch-action: none;
    }

    .summary {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      gap: 30px;
      min-height: 65px;
      margin-left: 40px;
      border-top: 1px solid var(--border);
      padding: 12px 0;
    }

    .series-name {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-right: auto;
      white-space: nowrap;
      font-weight: 500;
    }

    .series-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .stat-label {
      margin-right: 9px;
      color: var(--muted);
      font-size: 14px;
    }

    .stat-value {
      font: 17px Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .total-stat {
      margin-left: auto;
    }

    #demo-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: normal;
    }

    #generated-at {
      flex-shrink: 0;
      margin: 0;
      padding: 0 8px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    #status {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 32px);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 720px) {
      main {
        padding: 8px 8px 0;
      }

      .summary {
        gap: 18px;
        margin-left: 8px;
      }

      .stat-label {
        display: block;
        margin: 0 0 4px;
        font-size: 13px;
      }
    }

    @media (max-width: 430px) {
      .chart-heading {
        padding: 38px 8px 10px;
      }

      .summary {
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px;
      }

      .series-name {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="chart-heading">
      <select id="chart-theme" aria-label="Graph theme" title="Graph theme">
        <option value="light">Light</option>
        <option value="dark" selected>Dark</option>
        <option value="discord">Discord</option>
      </select>
      <h1 id="graph-title">Activity</h1>
      <div id="chart-controls" class="chart-controls" role="group" aria-label="Chart controls">
        <button id="select-range" type="button" title="Toggle range selection" aria-label="Toggle range selection" aria-pressed="true" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 3v6H1 M4 6h15v15H4V6 M10 6h3 M19 11v3" />
          </svg>
        </button>
        <button id="undo-range" type="button" title="Undo navigation (Ctrl+Z)" aria-label="Undo navigation" aria-keyshortcuts="Control+z Meta+z" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m8 4-5 5 5 5 M3 9h11a6 6 0 0 1 0 12h-3" />
          </svg>
        </button>
        <button id="reset-range" type="button" title="Reset range" aria-label="Reset range" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 8a9 9 0 1 0 1 7 M20 2v6h-6" />
          </svg>
        </button>
      </div>
    </header>

    <div
      id="chart"
      role="img"
      aria-label="Drag to select a time range, scroll to zoom, or use the overview slider. Press Ctrl+Z to undo navigation. Times are UTC."
    ></div>

    <footer class="summary" aria-label="Statistics for the visible time range">
      <div class="series-name">
        <span class="series-dot" aria-hidden="true"></span>
        <span id="metric-name">Activity</span>
        <span id="demo-label" hidden>Demo</span>
      </div>
      <div class="total-stat">
        <span class="stat-label" id="last-label">Last</span>
        <span class="stat-value" id="last">—</span>
      </div>
      <div class="time-series-stat">
        <span class="stat-label" id="minimum-label">Min</span>
        <span class="stat-value" id="minimum">—</span>
      </div>
      <div class="time-series-stat">
        <span class="stat-label">Max</span>
        <span class="stat-value" id="maximum">—</span>
      </div>
      <div class="time-series-stat">
        <span class="stat-label">Average</span>
        <span class="stat-value" id="average">—</span>
      </div>
    </footer>
    <p id="generated-at"></p>
  </main>

  <div id="status" role="status" aria-live="polite">Loading graph…</div>
  <script type="module" src="/activity.js"></script>
</body>
</html>
